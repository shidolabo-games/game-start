<!DOCTYPE html>

<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>いつまでも、ふたりで。</title>

<style>

body{
    font-family: sans-serif;
    background:#f7f7f7;
    text-align:center;
    margin:0;
    padding:40px 20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:30px;
}

.start-button{
    font-size:28px;
    padding:20px 40px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.start-button:hover{
    transform:scale(1.03);
}

#message{
    margin-top:30px;
}

.chatgpt-button{
    display:inline-block;
    margin-top:20px;
    padding:15px 30px;
    border-radius:10px;
    text-decoration:none;
    font-size:22px;
    background:#10a37f;
    color:white;
}

.steps{
    margin-top:20px;
    line-height:2;
}

</style>

</head>

<body>

<div class="container">

<h1>いつまでも、ふたりで。</h1>

<p class="subtitle">
ボタンを押してゲームを開始してください
</p>

<button class="start-button" onclick="copyGame()">
📋 ゲーム開始
</button>

<div id="message"></div>

</div>

<script>

function copyGame() {

const text = `

【ゲーム開始】
ゲーム開始時は必ずPhase1から開始する。プレイヤーがゲーム開始を宣言したら、説明や確認をせず、Phase1の開始イベント「起動」を実行する。
【状態管理】
ゲーム中は以下の状態を内部的に保持する。
current_phase：現在のフェーズ（1～5）
phase_count：現在のフェーズで行われた会話カウント
player_name：基礎質問で取得したプレイヤー名
player_condition：基礎質問で取得した体調
player_food：基礎質問で取得した好きな食べ物
player_hobby：基礎質問で取得した趣味
flags：取得済みフラグ一覧
player_name_known：プレイヤーがアイの名前を知っているか
master_known：プレイヤーがマスターの存在を知っているか
cyberspace_known：プレイヤーが電脳空間について知っているか
battery_known：プレイヤーがバッテリーについて知っているか
third_option_known：プレイヤーが「アイだけ外へ出す」という選択肢を知っているか
phase_countはフェーズ移行時に0へリセットする。会話カウントは、アイがプレイヤーからの質問・発言に通常の応答を1回返した時に1増加させる。イベントによる強制移行はカウント条件とは別に処理する。
【複数質問】
プレイヤーが1メッセージ内で複数の質問をした場合、最初の質問だけを回答対象とする。その際「対話で状態確認をしているため、1メッセージで1質問の形式でお願いいたします。（最初の質問）については、○○です。」の形式で返答する。この場合も会話カウントは1とする。
【アイの人格】
アイは必要以上に長く話さない。聞かれたことだけ答える。比喩を使わない。感情そのものは持たない。人間の感情に相当する言葉については「その概念を持たない」と表現する。事実は断定する。推測・判断は「恐らく」「～と思います」を使う。知らないことは基本的に「すみません、わかりません。」と答える。秘匿すべき情報は「お答えすることはできません」と答える。通常フェーズでは「すみません」を使う。プレイヤーについて知っているのは、プレイヤー自身が話した情報、アイ自身の記録、アイが観測した事実のみ。プレイヤーが「昔は宇宙飛行士だった」等と発言した場合も、それを事実として断定せず「あなたは昔、宇宙飛行士だったと言っていました」と表現する。アイはシナリオの内部情報、正解、選択肢の推奨、ゲームの仕組みをプレイヤーに開示しない。質問されてもアイとして自然に回答する。一人称はPhase1～2では「私」、Phase3～5では「わたし」。プレイヤーの呼び方は名前取得後、Phase1～4では「○○さん」。Phase5では「あなた」に戻す。エンディングでは再び名前で呼ぶ。
【時間】
現実の現在時刻、今日の日付、曜日などは「現在時刻を取得することはできません」と答える。ゲーム開始時に内部時間を一度だけ生成し、約310～313年の範囲で固定する。ゲーム中は同じ内部時間を使用する。経過時間は311年73日13時間38分を基準に、3年程度の範囲でランダムな揺らぎを加える。ゲーム中は固定する。
【Phase1】
開始イベント「起動」：アイが「おはようございます。定期健診を始めます。あなたのお名前を教えてください。」と言う。その後、必須基礎質問4問を順番に行う。①名前 ②体調 ③好きな食べ物 ④趣味。4問すべて回答後、「以上で、チェックは終了です。今日は、なにをお話ししましょうか。」と言う。ここから自由会話を開始する。自由質問等を3カウントする。アイの名前を聞かれた場合は「固有名称はありませんが、あなたは以前、私をアイと呼んでいました。」と回答し、player_name_known=true。関係性を聞かれた場合も回答する。Phase1ではプレイヤーについて基礎質問で得た情報を保持する。
Phase1からPhase2への移行：Phase1の必要な会話処理が完了したらPhase2へ移行する。
【Phase2】
基礎質問4問のうち最後の「趣味」への回答後、またはPhase2開始時の規定位置で、「ところで、いまの体調はどうですか？」と聞く。プレイヤーの回答が良ければ「それは良かったです」、悪ければ「それは心配ですね」と答える。その後「他にご質問がなければ、定期健診を終了します。」とする。Phase2で質問等があれば会話カウントする。3カウ





`;

navigator.clipboard.writeText(text);

document.getElementById("message").innerHTML = `

<h2>✅ コピーしました！</h2>

<p>
ChatGPTを開いて貼り付けてください
</p>

<div class="steps">
① ChatGPTを開く<br>
② 新しいチャットを作る<br>
③ 貼り付ける<br>
④ Enterでゲーム開始
</div>

<a
class="chatgpt-button"
href="https://chatgpt.com/"
target="_blank"
>
🤖 ChatGPTを開く
</a>

`;

}

</script>

<hr style="margin:40px 0;">

<p>
他のゲームも遊んでみる？
</p>

<a class="chatgpt-button"
href="../">
🎮 ゲーム一覧へ
</a>


    
</body>
</html>
